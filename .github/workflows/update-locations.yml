name: Update locations data

on:
  push:
    paths:
      - ee-systems-locations.csv

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/qa-csv.js
      - name: Commit changes
        run: |
          if [[ -n $(git status --porcelain data/locations.json) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/locations.json
            git commit -m "chore: update locations data" || true
            git push
          fi
